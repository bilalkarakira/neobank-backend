# Tests control when interest runs; the real scheduler stays off unless a test turns it on.
app.interest.scheduler-enabled=false
# Same for standing orders: tests call RecurringExecutor directly.
app.recurring.scheduler-enabled=false
app.security.refresh.scheduler-enabled=false
app.security.rate-limit.scheduler-enabled=false
# Most tests register and log in many times from one address, so the limits are lifted here. The tests that exercise
# the limits (RateLimitFlowTest and friends) put the real values back with @SpringBootTest(properties = ...).
app.security.rate-limit.login.max-failures=1000
app.security.rate-limit.login.failure-window=15m
app.security.rate-limit.login.lock-duration=15m
app.security.rate-limit.login-per-ip.limit=100000
app.security.rate-limit.login-per-ip.window=1m
app.security.rate-limit.refresh-per-ip.limit=100000
app.security.rate-limit.refresh-per-ip.window=1m
app.security.rate-limit.register-per-ip.limit=100000
app.security.rate-limit.register-per-ip.window=1h
app.security.rate-limit.lookup-per-user.limit=100000
app.security.rate-limit.lookup-per-user.window=1m
app.security.rate-limit.probe-misses.limit=100000
app.security.rate-limit.probe-misses.window=10m
