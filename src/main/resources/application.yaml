spring:
  application:
    name: neobank
  datasource:
    url: jdbc:postgresql://localhost:5433/neobank
    username: neobank
    password: neobank
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  security:
    jwt:
      # DEV ONLY default. Override with the JWT_SECRET env var (min 32 bytes) everywhere else.
      secret: ${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-0123456789}
      ttl: 15m
    cors:
      allowed-origins: http://localhost:4200
