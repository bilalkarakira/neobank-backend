spring:
  application:
    name: neobank
  datasource:
    url: jdbc:postgresql://localhost:5433/neobank
    username: neobank
    password: neobank
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  security:
    jwt:
      # DEV ONLY default. Override with the JWT_SECRET env var (min 32 bytes) everywhere else.
      secret: ${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-0123456789}
      ttl: 15m
    refresh:
      ttl: 7d             # one refresh token; every use renews it (rotation)
      max-lifetime: 30d   # a login can never last longer than this, however active
      reuse-grace: 10s    # a just-rotated token presented again (two tabs) is refused without ending the login
      cookie-secure: ${REFRESH_COOKIE_SECURE:false}   # MUST be true behind HTTPS in production
      scheduler-enabled: true
    rate-limit:
      scheduler-enabled: true
      # failed passwords per email (known or not): lock for lock-duration, even against the right password
      login: { max-failures: 5, failure-window: 15m, lock-duration: 15m }
      login-per-ip: { limit: 20, window: 1m }
      refresh-per-ip: { limit: 30, window: 1m }
      register-per-ip: { limit: 10, window: 1h }
      lookup-per-user: { limit: 20, window: 1m }
      # unknown/invalid IBANs tried through lookup or transfer: the sign of someone enumerating accounts
      probe-misses: { limit: 10, window: 10m }
    cors:
      allowed-origins: http://localhost:4200
  accounts:
    max-checking: 1
    max-savings: 4
  transfers:
    daily-limit: 5000.00
  history:
    export-max-rows: 10000
  cards:
    # DEV ONLY default. Override with CARD_PAN_KEY (>= 32 characters) everywhere else: it keys the hashes of PANs and PINs.
    pan-hmac-key: ${CARD_PAN_KEY:dev-only-card-key-change-me-0123456789abcdef}
    max-per-customer: 3
    default-daily-limit: 1000.00
    max-daily-limit: 5000.00
    per-transaction-cap: 2500.00
    velocity-max: 10             # approvals per card within velocity-window
    velocity-window: 10m
    hold-ttl: 7d                 # an authorization stops reserving money after this, unless cleared
    max-pin-failures: 3
    blocked-mcc: [7995, 4829, 6051]
    authorizations-enabled: true
    listener:
      enabled: true
      port: 8583
      max-connections: 50
      idle-timeout: 120s
  catch-up:
    enabled: true         # run interest and due standing orders once at startup, so downtime does not delay them
  recurring:
    scheduler-enabled: true
    cron: "0 5 * * * *"   # hourly at :05 UTC; a missed run is picked up by the next pass
    max-open: 10          # active + paused standing orders per user
    max-failures: 3       # consecutive failed runs before an order pauses itself
    max-catch-up: 31      # scheduled dates one order may run in a single pass (after downtime)
  interest:
    apy: 0.035            # 3.5% effective yearly rate, one flat rate for every savings account
    scheduler-enabled: true
    cron: "0 30 0 * * *"  # daily at 00:30 UTC; the first run of a month accrues the month that just ended
