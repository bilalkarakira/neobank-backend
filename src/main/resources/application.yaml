spring:
  application:
    name: neobank
  datasource:
    url: jdbc:postgresql://localhost:5433/neobank
    username: neobank
    password: neobank
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
