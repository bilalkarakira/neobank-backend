# Builds every module (codec, shared, network, acquirer) and runs all their tests.
# The tests start a real PostgreSQL in Docker (Testcontainers), which the GitHub-hosted Ubuntu runners provide.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # the wrapper script may not carry the executable bit when the repository was created on Windows
      - run: chmod +x mvnw

      - name: Build and test
        run: ./mvnw -B -ntp clean verify

      - name: Keep the test reports when something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/'
          retention-days: 7
