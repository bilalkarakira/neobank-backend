# Four jobs.
#
#  cardnet     the card network simulation: every module and every test (the tests start a real PostgreSQL in Docker).
#  backend     NeoBank itself: installs the ISO 8583 codec from cardnet/, then every test.
#  static      the scenario runner compiles and both compose files are valid.
#  scenario    the whole simulation end to end: the images are built, the stack is started (without the web app, which
#              lives in the neobank-frontend repository) and the scenario runner plays a whole card day against it
#              (payments, clearing, settlement, disputes, cash, online payments). It fails when any expectation is not met.
#              It takes a while, so it runs on pushes to the default branch, on demand, and every night.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

jobs:
  cardnet:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: cardnet/pom.xml

      - run: chmod +x cardnet/mvnw

      - name: Build and test every module
        working-directory: cardnet
        run: ./mvnw -B -ntp clean verify

      - name: Keep the test reports when something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cardnet-surefire-reports
          path: cardnet/**/target/surefire-reports/

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: |
            pom.xml
            cardnet/pom.xml

      - run: chmod +x mvnw cardnet/mvnw

      - name: Install the ISO 8583 codec (NeoBank depends on it)
        working-directory: cardnet
        run: ./mvnw -B -ntp -pl iso8583 -am install -DskipTests

      - name: Build and test NeoBank
        run: ./mvnw -B -ntp clean verify

      - name: Keep the test reports when something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: target/surefire-reports/

  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: The scenario runner compiles
        run: javac -d "$RUNNER_TEMP/scenario" demo/scenario/Scenario.java

      - name: Both compose files are valid
        working-directory: demo
        run: |
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.prebuilt.yml config --quiet

  scenario:
    if: github.event_name != 'push' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build the images and start the stack (the web app is not needed by the scenario)
        working-directory: demo
        run: docker compose up -d --build postgres neobank network acquirer

      - name: Play the card day
        working-directory: demo
        run: java scenario/Scenario.java

      - name: Show the logs when something failed
        if: failure()
        working-directory: demo
        run: docker compose logs --no-color --tail=200

      - name: Take the stack down and remove its volumes
        if: always()
        working-directory: demo
        run: docker compose down -v
