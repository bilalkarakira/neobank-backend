server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # the API of NeoBank (same origin for the browser, so no CORS and the refresh cookie works)
    location /api/ {
        proxy_pass http://neobank:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # the single-page app: every other path is the app
    location / {
        try_files $uri $uri/ /index.html;
    }
}
